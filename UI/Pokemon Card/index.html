<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Card</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="nav">
            <div class="menu">
                <div class="box">
                    <i class='bx bx-menu'></i>    
                </div>
            </div>
            <div class="logo">
                <div class="image">
                    <img src="./assets/pokemon-seeklogo.png" alt="">
                </div>
            </div>
            <div class="dark">
                <div class="box">
                    <i class='bx bx-sun' style='color:black' ></i>
                </div>
            </div>
        </div>
        <div class="sec-nav">
            <div class="search">
                <div class="inp">
                    <input type="search" placeholder="Search for a Pokemon...">
                </div>
                <div class="search-icon">
                    <i class='bx bx-search-alt-2' style='color:black' ></i>
                </div>
            </div>
            <div class="filter-sec">
                <div class="filter">
                    <div class="txt">
                        <p>Filter by types(1)</p>
                    </div>
                    <div class="filter-icon">
                        <i class='bx bx-chevron-down'></i>
                    </div>
                </div>
                <div class="sort">
                    <div class="sort-icon">
                        <i class='bx bx-sort-down' style='color:black' ></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-1">
                <div class="card-num">
                    <p>#0908</p>
                </div>
                <div class="type-logo">
                    <i class='bx bx-leaf' style='color:green' ></i>
                </div>
                <div class="pokemon">
                    <img src="./assets/Meowscarada.png" alt="Meowscarada" height="270">
                </div>
                <div class="fav">
                    <i class='bx bx-heart' style='color:black' ></i>
                </div>
                <div class="pokemon-name">
                    <p>Meowscarada</p>
                </div>
                <div class="type-name">
                    <div class="type">
                        <i class='bx bx-leaf' style='color:green' ></i>
                    </div>
                    <div class="type-icon">
                        <p style="font-size: 12px; color: green;">GRASS</p>
                    </div>
                </div>
                <div class="next">
                    <i class='bx bx-right-arrow-alt' style='color:black; font-size: 25px;' ></i>
                </div>
            </div>
            <div class="card-1">
